[project]
name = "qq-bot"
version = "0.2.0"
description = "Third-party QQ bot (NapCat + NoneBot2) with song-request feature"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27.0",
    "pillow>=10.1.0",
    "openai>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.nonebot]
plugin_dirs = ["src/qqbot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
